name: Fetch hero video

# Pulls the hero background video off the legacy Wix site and commits a
# web-ready encode into public/media/.
#
# Runs on a GitHub runner for two reasons: the development environment's
# egress proxy cannot reach video.wixstatic.com, and the runner has ffmpeg
# for the transcode.
#
# Wix stores a video's poster frame next to it as `<id>f000.jpg` and the
# video itself at video.wixstatic.com/video/<id>/<quality>/mp4/file.mp4, so
# the id is derived from whichever poster frame the homepage references.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ffmpeg is no longer on the ubuntu-latest image.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Locate the hero video
        id: find
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'

          curl -sSL -A "$UA" "https://www.alkhoud.com/" -o page.html
          echo "page: $(wc -c < page.html) bytes"

          echo "==> Any direct video references in the markup"
          grep -oE 'video\.wixstatic\.com/video/[A-Za-z0-9_~%./-]+' page.html | sort -u | tee direct.txt || true

          echo "==> Poster frames (<id>f000.jpg) — the id sits before the f000"
          grep -oE '[a-z0-9]+_[a-f0-9]{32}f000\.jpg' page.html | sort -u | tee posters.txt || true

          : > candidates.txt
          # ids derived from poster frames
          sed 's/f000\.jpg$//' posters.txt >> candidates.txt || true
          # ids appearing in any direct reference
          sed -E 's#.*/video/([^/]+)/.*#\1#' direct.txt >> candidates.txt || true
          sort -u candidates.txt -o candidates.txt
          echo "candidate ids:"; cat candidates.txt

          BEST=""; BEST_BYTES=0
          while read -r id; do
            [ -z "$id" ] && continue
            for q in 1080p 720p 480p 360p; do
              url="https://video.wixstatic.com/video/${id}/${q}/mp4/file.mp4"
              code=$(curl -sS -A "$UA" -o /dev/null -w '%{http_code}' -r 0-1 "$url" || echo 000)
              if [ "$code" = "200" ] || [ "$code" = "206" ]; then
                bytes=$(curl -sSI -A "$UA" "$url" | awk 'tolower($1)=="content-length:"{print $2+0}' | tr -d '\r')
                echo "  FOUND $q  ${bytes:-?} bytes  $url"
                if [ "${bytes:-0}" -gt "$BEST_BYTES" ]; then BEST="$url"; BEST_BYTES="${bytes:-0}"; fi
                break   # highest available quality for this id wins
              else
                echo "  miss  $q ($code)"
              fi
            done
          done < candidates.txt

          if [ -z "$BEST" ]; then
            echo "No hero video found. Nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Best source: $BEST ($BEST_BYTES bytes)"
          curl -sSL -A "$UA" "$BEST" -o hero-src.mp4
          ls -la hero-src.mp4
          ffprobe -v error -show_entries stream=width,height,codec_name,duration \
                  -show_entries format=duration,size -of default=noprint_wrappers=1 hero-src.mp4
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Transcode for the web
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail
          mkdir -p public/media

          # A muted decorative background loop: drop audio entirely, cap the
          # width, and move the moov atom to the front so it starts playing
          # before the whole file has arrived.
          #
          # crf 30 rather than a visually-lossless number: the film sits under
          # a scrim at 60-95% opacity and is scaled up 1.12x by the parallax,
          # so the detail a lower crf buys is never seen — it only costs the
          # visitor bandwidth on the one asset that blocks the hero.
          ffmpeg -y -loglevel error -i hero-src.mp4 \
            -an -vf "scale='min(1600,iw)':-2" \
            -c:v libx264 -profile:v high -pix_fmt yuv420p \
            -crf 30 -preset slow -movflags +faststart \
            public/media/hero.mp4

          # A VP9 fallback, listed *after* the MP4 in the markup rather than
          # before it. On this footage — near-white water on white — VP9 needs
          # a much higher crf than usual to beat x264 on size, so the MP4 is
          # the better file for everyone who can decode H.264. The WebM exists
          # for the browsers that cannot: open-source Chromium builds ship
          # without the proprietary codecs, and without this they would sit on
          # the poster frame.
          ffmpeg -y -loglevel error -i hero-src.mp4 \
            -an -vf "scale='min(1600,iw)':-2" \
            -c:v libvpx-vp9 -crf 44 -b:v 0 -row-mt 1 -deadline good -cpu-used 2 \
            public/media/hero.webm

          # Poster: the first frame, so nothing pops when playback starts.
          ffmpeg -y -loglevel error -i hero-src.mp4 -frames:v 1 -q:v 3 hero-poster.jpg
          ffmpeg -y -loglevel error -i hero-poster.jpg -vf "scale='min(1600,iw)':-2" \
            -c:v libwebp -quality 82 public/media/hero-poster.webp

          rm -f hero-src.mp4 hero-poster.jpg
          echo "==> Result"
          ls -la public/media/hero.*

      - name: Commit
        if: steps.find.outputs.found == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/media/hero.mp4 public/media/hero.webm public/media/hero-poster.webp
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Add the hero background video from the legacy site

          Downloaded and transcoded on a GitHub runner: the development
          environment cannot reach video.wixstatic.com and has no ffmpeg.
          Audio is stripped (decorative background loop) and the moov atom is
          moved to the front so playback can start before the file finishes."
            git push
          fi
